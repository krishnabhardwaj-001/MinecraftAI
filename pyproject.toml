[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-ai"
version = "1.0.0"
description = "Deterministic AI Datapack Maker for Minecraft Java Edition 1.21.11"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Krishna Bhardwaj"}
]
keywords = ["minecraft", "datapack", "ai", "generator", "1.21.11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.2.0",
    "openai>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
minecraft-ai = "run_pipeline:main"
minecraft-ai-web = "run_web:main"
minecraft-ai-eval = "eval.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai*", "generator*", "validator*", "repair*", "pipeline*", "qa*", "web*", "eval*"]

[tool.setuptools.package-data]
web = ["templates/*", "static/**/*"]
eval = ["dataset.json"]
"*" = ["*.json", "*.jsonl"]

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check whitespace and formatting
        run: |
          git diff --check HEAD~1..HEAD 2>/dev/null || git diff --check 2>/dev/null || true

      - name: Run unit and integration tests
        run: |
          python -m pytest -W error

      - name: Run evaluation benchmark
        run: |
          python -m eval.benchmark --summary-only

      - name: Environment-aware headless Minecraft verification
        run: |
          python -m pytest test_step20_golden.py::TestStep20HeadlessMinecraftServer -W error
